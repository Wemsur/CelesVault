[package]
name = "celesvault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WPS 教学资料收纳与归档工具"

[lib]
name = "celesvault_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }
# 固定 2.10.2 对应的代码生成/插件构建依赖，避免解析到新版内部接口。
tauri-codegen = { version = "=2.5.4", default-features = false }
tauri-plugin = { version = "=2.5.3", default-features = false }
tauri-utils = { version = "=2.8.2", default-features = false }

[dependencies]
tauri = { version = "=2.10.2", features = ["tray-icon", "image-png"] }
# 仅作为 Cargo 版本约束；应用仍通过 tauri API 使用窗口/托盘。
tauri-runtime = { version = "=2.10.0", default-features = false }
tauri-runtime-wry = { version = "=2.10.0", default-features = false }
tauri-macros = { version = "=2.5.4", default-features = false }
tauri-utils = { version = "=2.8.2", default-features = false }
tauri-plugin-single-instance = "=2.3.4"
tauri-plugin-dialog = "=2.4.0"
tauri-plugin-opener = "=2.5.0"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
vault-core = { path = "../crates/vault-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
	"Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Storage_FileSystem",
	"Win32_System_IO", "Win32_System_WindowsProgramming", "Win32_Devices_DeviceAndDriverInstallation",
	"Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_System_Com"
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
