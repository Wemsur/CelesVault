[package]
name = "vault-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
uuid = { version = "=1.23.3", features = ["v4"] }
chrono = "=0.4.42"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_Diagnostics_Etw",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_System_Threading", "Win32_System_WindowsProgramming",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }
