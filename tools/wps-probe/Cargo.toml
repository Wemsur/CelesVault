[package]
name = "celesvault-probe"
version = "0.1.1"
edition = "2024"
description = "Local, metadata-only Windows file I/O diagnostics for CelesVault"
license = "MIT"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_System_Console", "Win32_System_Diagnostics_Etw",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Ioctl",
  "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_System_WindowsProgramming",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
strip = "debuginfo"
