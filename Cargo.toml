[workspace]
members = ["src-tauri", "crates/vault-core"]
exclude = ["tools/wps-probe"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.release]
lto = "thin"
strip = "debuginfo"
